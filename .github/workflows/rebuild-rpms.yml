name: Build verified upstream RPMs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/upstream-sources.json
      - packages/**
  pull_request:
    paths:
      - config/upstream-sources.json
      - packages/**
      - tools/source_pipeline.py
      - .github/workflows/rebuild-rpms.yml
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: upstream-rpm-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          packages=$(jq -c '[.packages[].name]' config/upstream-sources.json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify direct upstream source
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 tools/source_pipeline.py "$PACKAGE" --output work/sources --report-dir work/reports
      - name: Build the verified source with its RPM recipe
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          test -d "packages/$PACKAGE"
          mkdir -p work/result
          docker run --rm --privileged \
            -e PACKAGE \
            -v "$PWD/work:/work:Z" \
            -v "$PWD/packages:/packages:ro,Z" \
            fedora:rawhide bash -exc '
              dnf -y install dnf-plugins-core mock rpm-build
              spec=$(find "/packages/$PACKAGE" -maxdepth 1 -name "*.spec" -print -quit)
              test -n "$spec"
              dnf -y builddep "$spec"
              rpmbuild -ba "$spec" \
                --define "_sourcedir /work/sources/$PACKAGE" \
                --define "_rpmdir /work/result"
              find /work/result -name "*.rpm" -type f -print0 | \
                xargs -0 -r rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}
          path: |
            work/result/*.rpm
            work/reports/*.json
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.packages != '[]'
    needs: rebuild
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: repository
          merge-multiple: true
      - name: Create and keylessly sign repository metadata
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c
          createrepo_c --update repository
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          install -m 0755 cosign /usr/local/bin/cosign
          cosign sign-blob --yes --bundle repository/repodata/repomd.xml.bundle repository/repodata/repomd.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repository
      - id: deployment
        uses: actions/deploy-pages@v4
